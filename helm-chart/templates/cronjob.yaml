{{- $root := . }}
{{- range .Values.cronjobs }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "tom-deploy.fullname" $root }}-cron-{{ .name }}
  labels:
{{ include "tom-deploy.labels" $root | indent 4 }}
    app.kubernetes.io/component: "cronjob"
spec:
  schedule: {{ required "cronjob.schedule is required" .schedule | quote }}
  {{- with .suspend }}
  suspend: {{ $root }}
  {{- end }}
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: {{ include "tom-deploy.name" $root }}
            app.kubernetes.io/instance: {{ $root.Release.Name }}
            app.kubernetes.io/component: "cronjob"
        spec:
          serviceAccountName: {{ template "tom-deploy.serviceAccountName" $root }}
          securityContext:
            {{- toYaml $root.Values.podSecurityContext | nindent 12 }}
          restartPolicy: Never
          containers:
            - name: {{ $root.Chart.Name }}-cron

              # Use the exact same application image as the backend
              image: "{{ $root.Values.image.repository }}:{{ $root.Values.image.tag }}"
              imagePullPolicy: {{ $root.Values.image.pullPolicy }}

              # Container-level security mirrors the backend to keep posture consistent
              securityContext:
                {{- toYaml $root.Values.securityContext | nindent 16 }}

              {{- if .command }}
              command: {{ toYaml .command | nindent 16 }}
              {{- end }}

              env:
                {{ include "tom-deploy.extraEnv" $root | nindent 16 }}
                {{ include "tom-deploy.backendEnv" $root | nindent 16 }}
              envFrom:
                - secretRef:
                    name: tom-deploy-secrets
              resources:
                {{- toYaml $root.Values.resources | nindent 16 }}
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
                  readOnly: false
                - name: specutils
                  mountPath: /.specutils
                  readOnly: false
                - name: astropy
                  mountPath: /.astropy
                  readOnly: false

          # Volumes mirror the backend Deployment and are memory-backed (tmpfs)
          volumes:
            - name: tmp
              emptyDir:
                medium: Memory
                sizeLimit: 16Mi
            - name: specutils
              emptyDir:
                medium: Memory
                sizeLimit: 16Mi
            - name: astropy
              emptyDir:
                medium: Memory
                sizeLimit: 16Mi

          # Node scheduling knobs passed through from chart values to keep behavior consistent
          {{- with $root.Values.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $root.Values.affinity }}
          affinity:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $root.Values.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
---
{{- end }}
