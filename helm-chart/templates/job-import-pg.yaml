{{- if .Values.jobs.import.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "tom-demo.fullname" . }}-import-pg
  labels:
    app.kubernetes.io/name: {{ include "tom-demo.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    "helm.sh/hook": {{ if .Values.jobs.import.onlyOnInstall }}post-install{{ else }}post-install,post-upgrade{{ end }}
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "tom-demo.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: Never
      initContainers:
        - name: fetch-dump
          image: {{ .Values.jobs.import.fetchImage | default "curlimages/curl:8.11.1" | quote }}
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -lc
            - |
              if [ -z {{ .Values.jobs.import.dumpUrl | quote }} ]; then
                echo "jobs.import.dumpUrl is required" >&2
                exit 1
              fi
              echo "Fetching dump from: {{ .Values.jobs.import.dumpUrl }}"
              curl -fsSL {{ .Values.jobs.import.dumpUrl | quote }} -o /work/dump.pg
          volumeMounts:
            - name: work
              mountPath: /work
      containers:
        - name: pg-restore
          image: {{ (.Values.jobs.import.postgresImage | default (.Values.cnpg.imageName | default "postgres:16")) | quote }}
          imagePullPolicy: IfNotPresent
          env:
            {{ include "tom-demo.extraEnv" . | nindent 12 }}
            {{ include "tom-demo.backendEnv" . | nindent 12 }}
          command:
            - sh
            - -lc
            - |
              if [ ! -s /work/dump.pg ]; then echo "dump not found" >&2; exit 1; fi
              export PGPASSWORD="$DB_PASS"
              pg_restore \
                -h "$DB_HOST" -p "${DB_PORT:-5432}" \
                -U "$DB_USER" -d "$DB_NAME" \
                --no-owner --no-acl /work/dump.pg
          volumeMounts:
            - name: work
              mountPath: /work
      volumes:
        - name: work
          emptyDir: {}
{{- end }}
