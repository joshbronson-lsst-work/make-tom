apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tom-deploy.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "tom-deploy.name" . }}
    helm.sh/chart: {{ include "tom-deploy.chart" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}

# write URL dictionary below to urls.json upon install
data:
  urls.json: |
    {
      "tomDemoApiUrl": {{ include "tom-deploy.mainDeployUrl" . | quote }}
    }
  TOM_DEMO_TEST_API_URL: http://tom-deploy-dev.lco.gtn
