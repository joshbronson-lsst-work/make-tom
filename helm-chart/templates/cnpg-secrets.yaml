{{- if and (not .Values.database.host) .Values.cnpg.superuser.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tom-deploy.fullname" . }}-cnpg-superuser
type: Opaque
stringData:
  # CloudNativePG expects the "password" key for superuserSecret
  password: {{ .Values.cnpg.superuser.password | quote }}
{{- end }}

{{- if and (not .Values.database.host) .Values.database.password }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tom-deploy.fullname" . }}-cnpg-app
type: Opaque
stringData:
  # Referenced in bootstrap.initdb.secret.name and must be under the
  # fixed key "password" as required by the CNPG CRD
  password: {{ .Values.database.password | quote }}
{{- end }}
